# The built-in styles in the gallery, in the order they show.
# A style is a look: a design, colours and options. It never holds your details.
# Style keys are the ones in the style section of a signature file; see docs/DEVELOPMENT.md.
# Keep each id: saved signature files refer to the style they use by its id.
# To add a style, copy an entry, give it a new id that starts with p-, and run pnpm test.

signature-styles: 1
styles:
  - id: p-layers
    name: Fluent Layers
    tag: Photo on a rounded card over a tilted gradient card, with a soft glare
    template: executive
    theme: copilot
    cols: 2
    photoShape: layers
    photoAnim: shine
    photoSize: L
    iconStyle: soft
    nameStyle: hand
  - id: p-sage-masthead
    name: Sage Masthead
    tag: Serif masthead on a soft sage card
    template: editorial
    theme: sage
    bgMode: solid
    bgColor: tint
