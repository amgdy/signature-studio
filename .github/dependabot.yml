version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react-ui:
        patterns:
          [
            'react',
            'react-dom',
            '@types/react*',
            '@base-ui/*',
            'lucide-react',
            'sonner',
            'shadcn',
            'tailwindcss',
            '@tailwindcss/*',
            'tw-animate-css',
            'class-variance-authority',
            'cn',
          ]
      vite-vitest:
        patterns: ['vite', 'vitest', '@vitest/*', '@vitejs/*', 'vite-plugin-*']
      tooling:
        patterns: ['typescript', 'oxlint*', 'prettier', '@types/node', 'playwright', '@playwright/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
