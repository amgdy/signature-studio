name: Bug report
description: Something looks wrong in a signature or in the Studio.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - New Outlook for Windows
        - Outlook on the web
        - Classic Outlook for Windows
        - Outlook for Mac
        - Outlook for iPhone or Android
        - The Studio itself
        - Somewhere else
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to see it
      description: The design, the settings and the steps. A signature file can help, but remove your personal details and images before sharing it.
    validations:
      required: true
  - type: textarea
    id: screens
    attributes:
      label: Screenshots
      description: Add screenshots of the problem if you can.
