name: Idea
description: Suggest a design, an option or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: outlook
    attributes:
      label: Outlook support
      description: If it changes the signature, does it work in every Outlook? See the Outlook rules in docs/DEVELOPMENT.md.
